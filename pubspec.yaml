name: novelphone
description: "NovelPhone：本地优先的手机小说创作工具，AI 是按需介入的写作伙伴。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# 依赖版本策略见 docs/ARCHITECTURE.md 第 10 章：pubspec.lock 锁定实际版本。
dependencies:
  flutter:
    sdk: flutter
  # 中文本地化（编辑器选择菜单等系统文案）
  flutter_localizations:
    sdk: flutter

  # 状态管理与依赖注入
  flutter_riverpod: ^3.4.3
  # 本地数据库（SQLite 类型安全封装）
  drift: ^2.35.0
  # 声明式路由
  go_router: ^18.0.2
  # API key 安全存储（keychain / keystore）
  flutter_secure_storage: ^11.2.0
  # 出网请求（SSE 流式解析）
  http: ^1.6.0
  # 应用私有目录（数据库与导入留档文件）
  path_provider: ^2.1.6

  cupertino_icons: ^1.0.8
  path: ^1.9.1
  # 导入：文件选择（txt/docx）
  file_picker: ^13.1.0
  # 导入/导出/备份：zip 归档与 docx 解包
  archive: ^4.3.0
  # docx 正文解析
  xml: ^7.0.1
  # 导入：GBK 编码探测与解码（纯 Dart 实现，无需原生插件）
  fast_gbk: ^1.0.0
  # 导出：调用系统分享面板
  share_plus: ^13.3.0
  mcp_dart: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # drift 代码生成
  drift_dev: ^2.35.0
  build_runner: ^2.10.0

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true