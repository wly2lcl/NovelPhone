name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-format-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: 依赖安装
        run: flutter pub get

      - name: 格式检查（dart format）
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态检查（flutter analyze）
        run: flutter analyze

      - name: 单元与 widget 测试（flutter test）
        run: flutter test

  # ENH-21：iOS 无签名构建，尽早发现 iOS 工程 / 插件 Pod 集成问题。
  # 只做编译校验（--no-codesign），不产出可分发产物，也不需要签名证书。
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: 依赖安装
        run: flutter pub get

      - name: iOS 无签名构建（flutter build ios --release --no-codesign）
        run: flutter build ios --release --no-codesign

  # ENH-24：release 产物（AAB / 分 ABI APK）构建与归档。
  # 使用临时 keystore，签名与正式发布签名不同，仅用于验证构建链路与产物结构；
  # 正式上架请按 docs/RELEASE.md §2.1 用离线发布证书重建。
  android-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: 依赖安装
        run: flutter pub get

      - name: 生成临时签名并写入 key.properties
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 12)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 \
            -alias novelphone -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=NovelPhone CI, OU=CI, O=NovelPhone, L=CI, ST=CI, C=CN"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=novelphone\nstoreFile=%s\n' \
            "$STORE_PASS" "$STORE_PASS" "$RUNNER_TEMP/upload-keystore.jks" \
            > android/key.properties

      - name: 构建 AAB
        run: flutter build appbundle --release

      - name: 构建分 ABI APK
        run: flutter build apk --release --split-per-abi

      - name: 上传 AAB
        uses: actions/upload-artifact@v4
        with:
          name: novelphone-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: novelphone-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14
