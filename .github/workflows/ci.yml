name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-format-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: 依赖安装
        run: flutter pub get

      - name: 格式检查（dart format）
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态检查（flutter analyze）
        run: flutter analyze

      - name: 单元与 widget 测试（flutter test）
        run: flutter test

  # ENH-21：iOS 无签名构建，尽早发现 iOS 工程 / 插件 Pod 集成问题。
  # 只做编译校验（--no-codesign），不产出可分发产物，也不需要签名证书。
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: 依赖安装
        run: flutter pub get

      - name: iOS 无签名构建（flutter build ios --release --no-codesign）
        run: flutter build ios --release --no-codesign
